<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/rafting.css">
    <meta name="description"
      content="Nossa página inicial com formulário para inscrição de newsletter e apresentação de nossa empresa!">
    <meta name="author" content="Manuela Santos">
    <title>Página Inicial - EcoRaft</title>
</head>

<body>
    <header>
        <img src="imagens/imagem-rafting.png" alt="logotipo">
        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="imagens/rafting-pagina.jpg" alt="rafting-pagina">
            <h1>EcoRaft</h1>
        </div>

        <section class="formulario">

            <div class="passeio">
                <h2>Venha Conhecer Nossos Passeios!</h2>
                    <img src="imagens/passeio-imagem.jpg" alt="passeio-imagem">
                <div class="faixa">
                    <a href="passeios.html">
                        <p>Clique Aqui!</p>
                    </a>
                </div>
            </div>

            <form>
                <h2>Quero me inscrever na newsletter!</h2>
                <div class="usuario">
                    <label for="nome-completo">Nome:</label>
                    <input type="text" id="nome-completo" name="nome-completo">
                </div>

                <div class="usuario">
                    <label for="email-do-usuario">Email:</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario">
                </div>

                <button type="submit">Entrar em Contato!</button>
            </form>

        </section>

        <section class="oferta">
            <h2>Finalidades e Ofertas</h2>
            <figure>
                <img src="imagens/funcionario1.jpg" alt="rafting-1">
                <figcaption>Ofertas</figcaption>
            </figure>
            <figure>
                <img src="imagens/funcionario2.jpg" alt="rafting-2">
                <figcaption>Finalidade</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 EcoRaft Manuela Santos</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com" target="_blank">
                <img src="imagens/facebook-logo.svg" alt="logo-facebook">
            </a>
            <a href="http://whatsapp.com" target="_blank">
                <img src="imagens/whatsapp-logo.svg" alt="logo-whatsapp">
            </a>
            <a href="http://instagram.com" target="_blank">
                <img src="imagens/instagram-logo.svg" alt="logo-instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
